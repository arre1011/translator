spring.application.name=translator-backend
server.port=8080

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com
openai.realtime-model=gpt-4o-realtime-preview

# Quota Configuration (MVP defaults)
quota.default-audio-seconds-per-day=600
quota.default-tokens-per-day=50000

# Logging
logging.level.org.trans.backend=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
